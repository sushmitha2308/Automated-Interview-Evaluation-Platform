# Server
server.port=6060
server.servlet.context-path=/api

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/interview_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=useradmin@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload.video-dir=./uploads/videos
file.upload.allowed-video-extensions=mp4,webm,avi,mov
file.upload.max-video-size=104857600

# JWT
jwt.secret=interview_platform_secret_key_2024_very_long_and_secure_key_for_jwt_signing
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.interview=DEBUG
logging.level.org.springframework.security=DEBUG
